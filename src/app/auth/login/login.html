<main class="auth-page">
  <section class="auth-panel" aria-labelledby="login-title">
    <div>
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Sign in to keep planning.</h1>
      <p class="auth-copy">Open your saved trips, routes, and travel notes.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Email
        <mat-form-field appearance="outline">
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <mat-error>Enter a valid email address.</mat-error>
          }
        </mat-form-field>
      </label>

      <label>
        Password
        <mat-form-field appearance="outline">
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <mat-error>Password is required.</mat-error>
          }
        </mat-form-field>
      </label>

      <button mat-flat-button class="app-primary-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    @if (message()) {
      <p class="auth-message">{{ message() }}</p>
    }

    <p class="auth-switch">New here? <a routerLink="/register">Create an account</a></p>
  </section>
</main>
