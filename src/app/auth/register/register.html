<main class="auth-page">
  <section class="auth-panel" aria-labelledby="register-title">
    <div>
      <p class="eyebrow">Join TripPlanner</p>
      <h1 id="register-title">Create your travel workspace.</h1>
      <p class="auth-copy">Save trips, organize routes, and come back when plans change.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-row">
        <label>
          First name
          <mat-form-field appearance="outline">
            <input matInput type="text" formControlName="firstName" autocomplete="given-name" />
            @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
              <mat-error>First name is required.</mat-error>
            }
          </mat-form-field>
        </label>

        <label>
          Last name
          <mat-form-field appearance="outline">
            <input matInput type="text" formControlName="lastName" autocomplete="family-name" />
            @if (form.controls.lastName.touched && form.controls.lastName.invalid) {
              <mat-error>Last name is required.</mat-error>
            }
          </mat-form-field>
        </label>
      </div>

      <label>
        Email
        <mat-form-field appearance="outline">
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <mat-error>Enter a valid email address.</mat-error>
          }
        </mat-form-field>
      </label>

      <label>
        Password
        <mat-form-field appearance="outline">
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <mat-error>Use at least 6 characters.</mat-error>
          }
        </mat-form-field>
      </label>

      <button mat-flat-button class="app-primary-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    @if (message()) {
      <p class="auth-message">{{ message() }}</p>
    }

    <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
