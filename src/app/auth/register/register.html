<main class="auth-page">
  <section class="auth-panel" aria-labelledby="register-title">
    <div>
      <p class="eyebrow">Join TripPlanner</p>
      <h1 id="register-title">Create your travel workspace.</h1>
      <p class="auth-copy">Save trips, organize routes, and come back when plans change.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-row">
        <label>
          First name
          <input type="text" formControlName="firstName" autocomplete="given-name" />
          @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
            <span>First name is required.</span>
          }
        </label>

        <label>
          Last name
          <input type="text" formControlName="lastName" autocomplete="family-name" />
          @if (form.controls.lastName.touched && form.controls.lastName.invalid) {
            <span>Last name is required.</span>
          }
        </label>
      </div>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span>Enter a valid email address.</span>
        }
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span>Use at least 6 characters.</span>
        }
      </label>

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    @if (message()) {
      <p class="auth-message">{{ message() }}</p>
    }

    <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
