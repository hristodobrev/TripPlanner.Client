<header class="topbar">
  <a class="brand" routerLink="/">TripPlanner</a>

  <div class="topbar-side">
    <mat-nav-list class="nav-list" aria-label="Primary navigation">
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      @if (currentUser()) {
        <a mat-list-item routerLink="/trips" routerLinkActive="active-link">Trips</a>
        <a
          mat-list-item
          routerLink="/logout"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Logout
        </a>
      } @else {
        <a
          mat-list-item
          routerLink="/login"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Login
        </a>
        <a
          mat-list-item
          routerLink="/register"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Register
        </a>
      }
    </mat-nav-list>
  </div>
</header>

<router-outlet />
