<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button class="app-secondary-button" [mat-dialog-close]="false">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>
  <button
    mat-flat-button
    [class]="data.confirmClass ?? 'app-primary-button'"
    [mat-dialog-close]="true"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
